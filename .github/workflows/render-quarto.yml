name: Render Quarto Website with renv

on:
  push:
    branches: [main]

jobs:
  render-and-commit:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up R
      uses: r-lib/actions/setup-r@v2

    - name: Set up Quarto
      uses: quarto-dev/quarto-actions/setup@v2

    - name: Install system dependencies for common R packages
      uses: r-lib/actions/setup-r-dependencies@v2
      with:
        extra-packages: renv

    - name: Restore R packages using renv
      run: |
        Rscript -e 'install.packages("renv")'
        Rscript -e 'renv::restore()'

    - name: Render Quarto site
      run: quarto render

    - name: Commit rendered site to docs/
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git add docs/
        git commit -m "Render and update site" || echo "No changes to commit"
        git push
